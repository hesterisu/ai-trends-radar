name: Auto-Update Digest

on:
  schedule:
    - cron: '0 7 */2 * *' # Berjalan otomatis setiap 2 hari pukul 07:00 UTC
  workflow_dispatch:      # Mengaktifkan tombol jalankan manual

permissions:
  contents: write

jobs:
  update-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run digest generator
        run: python update_digest.py

      - name: Commit and push updated README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md digests/
          git diff --staged --quiet || git commit -m "chore: auto-update AI tech digest"
          git push
